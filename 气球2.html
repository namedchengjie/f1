<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>气球打字大作战 - 道尔顿学校</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            height: 100vh;
            margin: 0;
        }

        .balloon {
            position: absolute;
            bottom: -100px;
            width: 75px;
            height: 95px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: bold;
            color: white;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.1s ease-out;
            user-select: none;
            z-index: 10;
        }

        .balloon::after {
            content: "";
            position: absolute;
            bottom: -15px;
            left: 50%;
            width: 2px;
            height: 20px;
            background: rgba(0,0,0,0.1);
        }

        .pop-effect {
            position: absolute;
            pointer-events: none;
            animation: explode 0.4s ease-out forwards;
            z-index: 5;
        }

        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        .floating {
            animation: drift 4s infinite ease-in-out;
        }

        @keyframes drift {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(20px); }
        }

        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

<div id="game-container" class="relative w-full h-full overflow-hidden">
    <!-- HUD -->
    <div id="hud" class="absolute top-0 left-0 w-full p-6 flex justify-between items-start z-50 pointer-events-none">
        <div class="bg-white/80 backdrop-blur p-4 rounded-2xl shadow-lg border border-white">
            <div class="text-gray-500 text-xs font-bold uppercase tracking-wider">当前得分</div>
            <div id="score" class="text-4xl font-black text-blue-600">000</div>
        </div>
        
        <div class="bg-white/80 backdrop-blur p-4 rounded-2xl shadow-lg border border-white text-center">
            <div class="text-gray-500 text-xs font-bold uppercase tracking-wider">剩余时间</div>
            <div id="timer" class="text-4xl font-black text-red-500">03:00</div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="absolute inset-0 z-[100] flex items-center justify-center bg-blue-900/40 backdrop-blur-sm">
        <div class="bg-white p-8 rounded-3xl shadow-2xl text-center max-w-lg w-full mx-4 flex flex-col md:flex-row gap-8">
            <div class="flex-1">
                <h1 class="text-3xl font-black text-gray-800 mb-2">🎈 气球打字</h1>
                <p class="text-gray-500 mb-6 text-sm">输入气球上的字母，击破它们！</p>
                
                <!-- Settings Section -->
                <div class="space-y-6 mb-6 text-left">
                    <div>
                        <p class="text-xs font-bold text-gray-400 uppercase mb-2">上升速度 (难度)</p>
                        <div class="grid grid-cols-5 gap-2">
                            <button onclick="setDifficulty(1)" class="diff-btn py-2 rounded-xl border-2 border-gray-100 hover:border-blue-500 transition-all font-bold text-gray-600" id="diff-1">1</button>
                            <button onclick="setDifficulty(2)" class="diff-btn py-2 rounded-xl border-2 border-gray-100 hover:border-blue-500 transition-all font-bold text-gray-600" id="diff-2">2</button>
                            <button onclick="setDifficulty(3)" class="diff-btn py-2 rounded-xl border-2 border-blue-500 bg-blue-50 text-blue-600 font-bold" id="diff-3">3</button>
                            <button onclick="setDifficulty(4)" class="diff-btn py-2 rounded-xl border-2 border-gray-100 hover:border-blue-500 transition-all font-bold text-gray-600" id="diff-4">4</button>
                            <button onclick="setDifficulty(5)" class="diff-btn py-2 rounded-xl border-2 border-gray-100 hover:border-blue-500 transition-all font-bold text-gray-600" id="diff-5">5</button>
                        </div>
                    </div>

                    <div>
                        <p class="text-xs font-bold text-gray-400 uppercase mb-2">同屏气球上限</p>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="setMaxBalloons(2)" class="count-btn py-2 rounded-xl border-2 border-blue-500 bg-blue-50 text-blue-600 font-bold" id="count-2">2 个</button>
                            <button onclick="setMaxBalloons(3)" class="count-btn py-2 rounded-xl border-2 border-gray-100 hover:border-blue-500 transition-all font-bold text-gray-600" id="count-3">3 个</button>
                            <button onclick="setMaxBalloons(4)" class="count-btn py-2 rounded-xl border-2 border-gray-100 hover:border-blue-500 transition-all font-bold text-gray-600" id="count-4">4 个</button>
                        </div>
                    </div>
                </div>

                <button onclick="startGame()" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xl font-bold py-4 rounded-2xl shadow-lg transition-all transform hover:scale-105">
                    开始游戏
                </button>
            </div>

            <!-- Leaderboard in Start Screen -->
            <div class="w-full md:w-56 bg-gray-50 rounded-2xl p-4 border border-gray-100">
                <h3 class="text-sm font-black text-gray-700 mb-4 border-b pb-2">🏆 名人堂 (Top 3)</h3>
                <div id="leaderboard-list" class="space-y-3 text-left">
                    <!-- Leaderboard items injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- New High Score Modal -->
    <div id="name-input-screen" class="absolute inset-0 z-[120] hidden flex items-center justify-center bg-blue-600/20 backdrop-blur-md">
        <div class="bg-white p-8 rounded-3xl shadow-2xl text-center max-w-sm w-full mx-4">
            <div class="text-5xl mb-4">🌟</div>
            <h2 class="text-2xl font-black text-gray-800 mb-2">创纪录啦！</h2>
            <p class="text-gray-500 mb-6">进入了排行榜前三名，留下你的大名：</p>
            <input type="text" id="player-name" maxlength="10" placeholder="输入姓名" class="w-full px-4 py-3 rounded-xl border-2 border-blue-100 focus:border-blue-500 outline-none mb-4 text-center text-lg font-bold">
            <button onclick="submitScore()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-all">
                保存并查看结果
            </button>
        </div>
    </div>

    <!-- End Screen -->
    <div id="end-screen" class="absolute inset-0 z-[110] hidden flex items-center justify-center bg-gray-900/80 backdrop-blur-md">
        <div class="bg-white p-10 rounded-3xl shadow-2xl text-center max-w-sm w-full mx-4">
            <div class="text-6xl mb-4" id="end-emoji">🏆</div>
            <h2 class="text-3xl font-black text-gray-800 mb-2">练习结束</h2>
            <div class="text-gray-500 mb-6">最终得分</div>
            <div id="final-score" class="text-6xl font-black text-blue-600 mb-8">0</div>
            <button onclick="location.reload()" class="w-full bg-gray-800 hover:bg-black text-white font-bold py-4 rounded-2xl transition-all">
                再来一局
            </button>
        </div>
    </div>

    <!-- Watermark -->
    <div class="fixed bottom-6 right-6 text-right opacity-30 pointer-events-none z-[200]">
        <div class="text-gray-600 font-bold text-xl tracking-widest">道尔顿学校</div>
        <div id="watermark-date" class="text-gray-500 text-xs mt-1"></div>
    </div>
</div>

<script>
    let score = 0;
    let timeLeft = 180;
    let difficulty = 3;
    let maxBalloons = 2; // Default maximum
    let gameActive = false;
    let spawnTimer;
    let countdownTimer;
    let topScores = [];

    const container = document.getElementById('game-container');
    const colors = ['#FF5252', '#448AFF', '#4CAF50', '#FFAB40', '#E040FB', '#00BCD4'];

    // Load Local Scores
    function init() {
        const saved = localStorage.getItem('dalton_typing_scores');
        if (saved) {
            topScores = JSON.parse(saved);
        }
        renderLeaderboard();
        
        document.getElementById('watermark-date').innerText = new Date().toLocaleDateString('zh-CN', {
            year: 'numeric', month: 'long', day: 'numeric'
        });
    }

    function renderLeaderboard() {
        const list = document.getElementById('leaderboard-list');
        if (topScores.length === 0) {
            list.innerHTML = '<div class="text-gray-400 text-xs italic text-center">暂无纪录，快来挑战！</div>';
            return;
        }
        list.innerHTML = topScores.map((s, i) => `
            <div class="flex flex-col border-b border-gray-100 pb-2 last:border-0">
                <div class="flex justify-between items-center">
                    <span class="font-bold text-gray-700 text-sm truncate pr-2">${i+1}. ${s.name}</span>
                    <span class="text-blue-600 font-black text-sm">${s.score}</span>
                </div>
                <div class="text-[10px] text-gray-400">${s.date}</div>
            </div>
        `).join('');
    }

    // Difficulty Settings
    window.setDifficulty = (d) => {
        difficulty = d;
        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-600');
            btn.classList.add('border-gray-100', 'text-gray-600');
        });
        const activeBtn = document.getElementById(`diff-${d}`);
        activeBtn.classList.add('border-blue-500', 'bg-blue-50', 'text-blue-600');
    };

    // Max Balloons Settings
    window.setMaxBalloons = (count) => {
        maxBalloons = count;
        document.querySelectorAll('.count-btn').forEach(btn => {
            btn.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-600');
            btn.classList.add('border-gray-100', 'text-gray-600');
        });
        const activeBtn = document.getElementById(`count-${count}`);
        activeBtn.classList.add('border-blue-500', 'bg-blue-50', 'text-blue-600');
    };

    // Game Control
    window.startGame = () => {
        document.getElementById('start-screen').classList.add('hidden');
        score = 0;
        timeLeft = 180;
        gameActive = true;
        document.getElementById('score').innerText = "000";
        // Check spawn faster if maxBalloons is higher
        spawnTimer = setInterval(checkSpawn, 300); 
        countdownTimer = setInterval(updateTimer, 1000);
    };

    function updateTimer() {
        if (timeLeft <= 0) {
            endGame();
            return;
        }
        timeLeft--;
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        document.getElementById('timer').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function checkSpawn() {
        const currentBalloons = document.querySelectorAll('.balloon').length;
        if (currentBalloons < maxBalloons) {
            createBalloon();
        }
    }

    function createBalloon() {
        if (!gameActive) return;
        const balloon = document.createElement('div');
        const char = String.fromCharCode(97 + Math.floor(Math.random() * 26));
        const color = colors[Math.floor(Math.random() * colors.length)];
        const startX = Math.random() * (window.innerWidth - 120) + 60;
        
        balloon.className = 'balloon floating';
        balloon.style.left = `${startX}px`;
        balloon.style.backgroundColor = color;
        balloon.innerText = char;
        balloon.dataset.char = char;

        // Speed relative to difficulty
        const speed = 0.8 + (difficulty * 0.4) + (Math.random() * 0.5);
        let currentBottom = -110;

        container.appendChild(balloon);
        const moveInterval = setInterval(() => {
            if (!gameActive) { clearInterval(moveInterval); balloon.remove(); return; }
            currentBottom += speed;
            balloon.style.bottom = `${currentBottom}px`;
            if (currentBottom > window.innerHeight) { 
                clearInterval(moveInterval); 
                balloon.remove(); 
            }
        }, 20);
        balloon.dataset.intervalId = moveInterval;
    }

    // Input Handling
    window.addEventListener('keydown', (e) => {
        if (!gameActive) return;
        const key = e.key.toLowerCase();
        const balloons = Array.from(document.querySelectorAll('.balloon'));
        const target = balloons
            .filter(b => b.dataset.char === key)
            .sort((a, b) => parseFloat(b.style.bottom) - parseFloat(a.style.bottom))[0];
        if (target) popBalloon(target);
    });

    function popBalloon(element) {
        // Sound
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);

        score += 10;
        document.getElementById('score').innerText = score.toString().padStart(3, '0');

        const rect = element.getBoundingClientRect();
        const effect = document.createElement('div');
        effect.className = 'pop-effect';
        effect.style.cssText = `left:${rect.left}px; top:${rect.top}px; width:${rect.width}px; height:${rect.height}px; background-color:${element.style.backgroundColor}; border-radius:50%;`;
        container.appendChild(effect);
        setTimeout(() => effect.remove(), 400);

        clearInterval(element.dataset.intervalId);
        element.remove();
    }

    function endGame() {
        gameActive = false;
        clearInterval(spawnTimer);
        clearInterval(countdownTimer);
        document.getElementById('final-score').innerText = score;
        
        const isHighScore = score > 0 && (topScores.length < 3 || score > topScores[topScores.length - 1].score);
        
        if (isHighScore) {
            document.getElementById('name-input-screen').classList.remove('hidden');
        } else {
            document.getElementById('end-screen').classList.remove('hidden');
        }
    }

    window.submitScore = () => {
        const nameInput = document.getElementById('player-name');
        const name = nameInput.value.trim() || "匿名英雄";
        
        const now = new Date();
        const dateStr = now.toLocaleDateString('zh-CN') + ' ' + now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
        
        const newRecord = {
            name: name,
            score: score,
            date: dateStr
        };

        topScores.push(newRecord);
        topScores.sort((a, b) => b.score - a.score);
        topScores = topScores.slice(0, 3);

        localStorage.setItem('dalton_typing_scores', JSON.stringify(topScores));
        
        document.getElementById('name-input-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');
    };

    init();
</script>

</body>
</html>
