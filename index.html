<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双扣扑克座位随机分配器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Serif+SC:wght@400;700&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        .poker-table {
            position: relative;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, #166534 0%, #064e3b 100%);
            border: 12px solid #451a03;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.5);
        }

        .seat {
            position: absolute;
            width: 80px;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .seat-main { top: 50%; left: -50px; transform: translateY(-50%); }
        .seat-1 { top: -50px; left: 50%; transform: translateX(-50%); }
        .seat-2 { top: 50%; right: -50px; transform: translateY(-50%); }
        .seat-3 { bottom: -50px; left: 50%; transform: translateX(-50%); }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #1e293b;
            border: 3px solid #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.875rem;
            color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            text-align: center;
            padding: 4px;
        }

        .seat-active .avatar {
            border-color: #fbbf24;
            background: #fbbf24;
            color: #451a03;
        }

        .seat-label {
            font-size: 0.75rem;
            margin-top: 4px;
            color: #94a3b8;
            font-weight: 600;
        }

        .seat-main .seat-label { color: #fbbf24; }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #334155;
            border-radius: 10px;
        }

        .copyright-tag {
            font-family: 'Noto Serif SC', serif;
            letter-spacing: 0.05em;
        }

        /* 柱状图动画 */
        .bar {
            transition: height 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center min-h-screen relative overflow-x-hidden">

    <!-- 右上角版权信息 -->
    <div class="fixed top-6 right-6 flex flex-col items-end z-50 opacity-60 hover:opacity-100 transition-opacity pointer-events-none md:pointer-events-auto">
        <div class="bg-slate-900/40 backdrop-blur-sm px-4 py-2 rounded-lg border border-white/5 shadow-xl text-right">
            <p class="copyright-tag text-xs text-slate-400">
                出品：<span class="text-amber-500 font-bold">老钱</span>
            </p>
            <p class="text-[10px] text-slate-500 font-mono mt-0.5">VERSION A1</p>
        </div>
    </div>

    <div class="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-2 gap-8 items-start mb-24 mt-4">
        
        <!-- 左侧控制面板 -->
        <div class="bg-slate-800 p-6 rounded-2xl shadow-2xl space-y-8">
            <div>
                <h1 class="text-2xl font-bold mb-2 flex items-center gap-2">
                    <span class="text-amber-500">♠</span> 德州座位分配器
                </h1>
                <p class="text-slate-400 text-sm">第一步：输入名单 (最多7人)</p>
            </div>

            <!-- 第一步：名单录入 -->
            <div class="space-y-3">
                <div class="flex gap-2">
                    <input type="text" id="nameInput" placeholder="输入姓名..." 
                        class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 flex-1 focus:outline-none focus:ring-2 focus:ring-amber-500 transition-all text-white">
                    <button onclick="addPerson()" class="bg-amber-600 hover:bg-amber-500 text-white px-4 py-2 rounded-lg font-bold transition-colors">
                        添加
                    </button>
                </div>
                <div id="personList" class="flex flex-wrap gap-2 max-h-32 overflow-y-auto custom-scrollbar p-1"></div>
            </div>

            <!-- 第二步：勾选人员 -->
            <div class="pt-4 border-t border-slate-700">
                <div class="flex justify-between items-end mb-4">
                    <h2 class="text-lg font-semibold text-slate-200">第二步：勾选参加人员</h2>
                    <span class="text-sm text-slate-400" id="selectionCount">已选: 0/4</span>
                </div>
                <div id="selectionArea" class="grid grid-cols-2 gap-2">
                    <p class="text-slate-500 text-sm italic col-span-2 text-center">请先在上方添加人员名单</p>
                </div>
            </div>

            <!-- 第三步：随机分配 -->
            <div class="pt-4 border-t border-slate-700">
                <button onclick="randomizeSeats()" id="randomBtn" disabled
                    class="w-full bg-gradient-to-r from-amber-600 to-orange-600 disabled:from-slate-700 disabled:to-slate-700 disabled:cursor-not-allowed text-white font-bold py-4 rounded-xl text-lg shadow-lg hover:from-amber-500 hover:to-orange-500 transition-all transform active:scale-95">
                    第三步：随机分配座位
                </button>
                <p id="msg" class="text-center mt-3 text-sm text-amber-500 font-medium h-5"></p>
            </div>
        </div>

        <!-- 右侧：桌子 + 统计图表 -->
        <div class="flex flex-col items-center gap-12">
            <!-- 桌子显示 -->
            <div class="flex flex-col items-center justify-center pt-10 min-h-[360px]">
                <div class="poker-table">
                    <div class="absolute inset-4 border border-white/10 rounded-lg pointer-events-none"></div>
                    
                    <div id="seat-main" class="seat seat-main">
                        <div class="avatar">空</div>
                        <div class="seat-label">主位 (左)</div>
                    </div>
                    <div id="seat-1" class="seat seat-1">
                        <div class="avatar">空</div>
                        <div class="seat-label">1号位 (上)</div>
                    </div>
                    <div id="seat-2" class="seat seat-2">
                        <div class="avatar">空</div>
                        <div class="seat-label">2号位 (右)</div>
                    </div>
                    <div id="seat-3" class="seat seat-3">
                        <div class="avatar">空</div>
                        <div class="seat-label">3号位 (下)</div>
                    </div>

                    <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-20">
                        <span class="text-6xl font-bold text-white/50">POKER</span>
                    </div>
                </div>
            </div>

            <!-- 柱状图统计区 -->
            <div class="w-full bg-slate-800/50 p-6 rounded-2xl border border-slate-700 shadow-inner">
                <h3 class="text-sm font-semibold text-slate-400 mb-6 flex items-center gap-2">
                    <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    主位累计统计
                </h3>
                <div id="chartContainer" class="flex items-end justify-around h-32 gap-2 px-2 border-b border-slate-700/50 pb-2">
                    <!-- 动态生成柱状图 -->
                </div>
                <div id="chartLabels" class="flex justify-around mt-2 gap-2">
                    <!-- 动态生成标签 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let allPeople = []; // 在场人员名单
        let selectedPeople = []; // 选中的人
        let mainSeatStats = {}; // 主位统计数据

        const nameInput = document.getElementById('nameInput');
        const personListEl = document.getElementById('personList');
        const selectionArea = document.getElementById('selectionArea');
        const selectionCountEl = document.getElementById('selectionCount');
        const randomBtn = document.getElementById('randomBtn');
        const msgEl = document.getElementById('msg');
        const chartContainer = document.getElementById('chartContainer');
        const chartLabels = document.getElementById('chartLabels');

        function addPerson() {
            const name = nameInput.value.trim();
            if (!name) return;
            if (allPeople.length >= 7) {
                showMsg('名单最多容纳7人');
                return;
            }
            if (allPeople.includes(name)) {
                showMsg('姓名不能重复');
                return;
            }

            allPeople.push(name);
            mainSeatStats[name] = 0; 
            nameInput.value = '';
            renderAll();
            renderChart();
        }

        function removePerson(index) {
            const name = allPeople[index];
            allPeople.splice(index, 1);
            delete mainSeatStats[name]; 
            
            const sIdx = selectedPeople.indexOf(name);
            if (sIdx > -1) selectedPeople.splice(sIdx, 1);
            
            renderAll();
            renderChart();
        }

        function togglePerson(name) {
            const index = selectedPeople.indexOf(name);
            if (index > -1) {
                selectedPeople.splice(index, 1);
            } else {
                if (selectedPeople.length >= 4) {
                    showMsg('每局最多只能选4个人');
                    renderAll(); 
                    return;
                }
                selectedPeople.push(name);
            }
            updateBtnState();
            renderSelectionCount();
        }

        function renderAll() {
            personListEl.innerHTML = allPeople.map((name, i) => `
                <div class="bg-slate-700 px-3 py-1 rounded-full flex items-center gap-2 text-sm border border-slate-600 animate-in fade-in zoom-in duration-300">
                    <span class="text-white">${name}</span>
                    <button onclick="removePerson(${i})" class="text-slate-400 hover:text-red-400 transition-colors">×</button>
                </div>
            `).join('');

            if (allPeople.length === 0) {
                selectionArea.innerHTML = `<p class="text-slate-500 text-sm italic col-span-2 text-center py-4">请先在上方添加人员名单</p>`;
            } else {
                selectionArea.innerHTML = allPeople.map(name => `
                    <label class="flex items-center gap-3 bg-slate-900/50 p-3 rounded-lg border border-slate-700 cursor-pointer hover:bg-slate-700 transition-all group">
                        <input type="checkbox" 
                            ${selectedPeople.includes(name) ? 'checked' : ''} 
                            onchange="togglePerson('${name}')"
                            class="w-5 h-5 accent-amber-500">
                        <span class="text-sm font-medium truncate text-slate-300 group-hover:text-white">${name}</span>
                    </label>
                `).join('');
            }

            renderSelectionCount();
            updateBtnState();
        }

        function renderChart() {
            if (allPeople.length === 0) {
                chartContainer.innerHTML = '';
                chartLabels.innerHTML = '';
                return;
            }

            const counts = Object.values(mainSeatStats);
            const maxVal = counts.length > 0 ? Math.max(...counts, 1) : 1;
            
            chartContainer.innerHTML = allPeople.map(name => {
                const count = mainSeatStats[name] || 0;
                const heightPercent = (count / (maxVal + 0.5)) * 100;
                return `
                    <div class="flex-1 flex flex-col items-center justify-end h-full group relative">
                        <div class="text-[10px] text-amber-500 mb-1 font-bold ${count === 0 ? 'opacity-0' : 'opacity-100'} transition-opacity">${count}</div>
                        <div class="bar w-full max-w-[28px] bg-gradient-to-t from-amber-600 to-amber-400 rounded-t-sm shadow-[0_0_10px_rgba(251,191,36,0.2)]" 
                             style="height: ${Math.max(heightPercent, 2)}%;"></div>
                    </div>
                `;
            }).join('');

            chartLabels.innerHTML = allPeople.map(name => `
                <div class="flex-1 text-center">
                    <span class="text-[10px] text-slate-500 truncate block w-full px-1">${name}</span>
                </div>
            `).join('');
        }

        function renderSelectionCount() {
            selectionCountEl.textContent = `已选: ${selectedPeople.length}/4`;
            selectionCountEl.className = `text-sm ${selectedPeople.length === 4 ? 'text-amber-500 font-bold' : 'text-slate-400'}`;
        }

        function updateBtnState() {
            randomBtn.disabled = selectedPeople.length === 0;
        }

        function showMsg(txt) {
            msgEl.textContent = txt;
            setTimeout(() => { if(msgEl.textContent === txt) msgEl.textContent = ''; }, 3000);
        }

        function randomizeSeats() {
            const seats = ['main', '1', '2', '3'];
            const shuffled = [...selectedPeople].sort(() => Math.random() - 0.5);
            
            // 抽中主位记录
            const mainPerson = shuffled[0];
            mainSeatStats[mainPerson]++;

            // 清空
            seats.forEach(s => {
                const el = document.getElementById(`seat-${s}`);
                el.classList.remove('seat-active');
                el.querySelector('.avatar').textContent = '空';
            });

            randomBtn.disabled = true;

            let i = 0;
            const interval = setInterval(() => {
                if (i >= shuffled.length) {
                    clearInterval(interval);
                    showMsg('座位分配完成！');
                    updateBtnState();
                    renderChart(); 
                    return;
                }
                
                const seatId = seats[i];
                const personName = shuffled[i];
                const el = document.getElementById(`seat-${seatId}`);
                
                el.classList.add('seat-active');
                el.querySelector('.avatar').textContent = personName;
                
                i++;
            }, 300);
        }

        nameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addPerson();
        });

    </script>
</body>
</html>
